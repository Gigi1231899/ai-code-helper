# =============================================================
# 生产/容器部署配置（不含任何明文密钥，全部从环境变量注入）
# 启动示例：
#   docker run -e SPRING_PROFILES_ACTIVE=prod \
#              -e DB_URL=... -e DB_USERNAME=... -e DB_PASSWORD=... \
#              -e JWT_SECRET=... -e DASHSCOPE_API_KEY=... -e BIGMODEL_API_KEY=... \
#              -v /opt/ai-code-helper/data:/app/data -p 8090:8090 ai-code-helper
# =============================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/ai_code_helper?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
        temperature: 0.7
        max-tokens: 4096
      streaming-chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
      embedding-model:
        model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v1}
        api-key: ${DASHSCOPE_API_KEY:}

bigModel:
  api-key: ${BIGMODEL_API_KEY:}

jwt:
  # 生产环境必须通过环境变量注入，禁止使用默认值
  secret: ${JWT_SECRET:please-set-JWT_SECRET-env-var-at-least-32-bytes}
  expiration-hours: ${JWT_EXPIRATION_HOURS:168}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
