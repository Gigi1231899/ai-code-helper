events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml text/xml text/x-component application/json image/svg+xml;
    server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 【修复】后端 /api/chat 是 SSE 流式接口，默认开启的代理缓冲 + gzip 会把响应攒在缓冲区，
    # 前端表现为"憋很久后一次性输出"。这里必须关闭缓冲与 gzip，并放宽读超时
    location /api {
        proxy_pass http://ai-code-helper-app:8090/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接必需
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;            # 关闭响应缓冲，保证流式实时推送
        proxy_cache off;
        gzip off;                       # gzip 会强制缓冲，必须关
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;       # AI 生成时间较长，默认 60s 会被断开
        proxy_send_timeout 3600s;
    }


    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
}

